<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código QR &mdash; Información Nutrimental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fdf6ec;
      --cocoa: #4a2c1a;
      --cocoa-soft: #6f4b31;
      --caramel: #b9762f;
      --berry: #a8324a;
      --line: #e2cdb2;
      --white: #fffdfa;
      --shadow: 0 18px 40px -18px rgba(74, 44, 26, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #2e1e13;
      background:
        radial-gradient(1200px 600px at 15% -10%, #fff4e2 0%, transparent 60%),
        radial-gradient(900px 500px at 95% 0%, #f3ddc2 0%, transparent 55%),
        linear-gradient(180deg, var(--cream) 0%, #f4e2cb 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--white);
      border: 1px solid rgba(226, 205, 178, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 32px 28px 26px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--caramel);
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 22px;
      color: var(--cocoa);
      letter-spacing: -0.01em;
    }

    .qr-frame {
      display: inline-block;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: inset 0 0 0 6px #fdf6ec;
    }

    .qr-frame img,
    .qr-frame canvas {
      display: block;
      width: 260px;
      height: 260px;
      image-rendering: pixelated;
    }

    .qr-frame canvas { display: none; }

    .url {
      display: block;
      margin: 20px 0 4px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--caramel);
      word-break: break-all;
      text-decoration: none;
    }

    .url:hover { text-decoration: underline; }

    .hint {
      margin: 0 0 22px;
      font-size: 0.8rem;
      color: var(--cocoa-soft);
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 20px;
      border-top: 2px solid var(--line);
    }

    button {
      font: inherit;
      font-weight: 800;
      font-size: 0.86rem;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fbf1e2;
      color: var(--cocoa);
      transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    button.primary {
      grid-column: 1 / -1;
      background: var(--cocoa);
      border-color: var(--cocoa);
      color: #ffe9c9;
    }

    button.primary:hover { background: #5b3a21; }

    .status {
      min-height: 18px;
      margin: 14px 0 0;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--berry);
    }

    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; border: none; max-width: none; }
      .actions, .hint, .status { display: none; }
    }
  </style>
</head>
<body>

  <main class="card">
    <p class="eyebrow">Panadería Doña Rosa</p>
    <h1>Información Nutrimental</h1>

    <div class="qr-frame">
      <img src="qr.svg" alt="Código QR que enlaza a la página de información nutrimental" />
      <canvas id="qrCanvas" width="41" height="41"></canvas>
    </div>

    <a class="url" href="https://c4rl05-git.github.io/informacion-nutrimental/" target="_blank" rel="noopener">
      c4rl05-git.github.io/informacion-nutrimental
    </a>
    <p class="hint">Apunta la cámara del celular al código para abrir la etiqueta.</p>

    <div class="actions">
      <button class="primary" id="png">Descargar PNG</button>
      <button id="svg">Descargar SVG</button>
      <button id="copy">Copiar enlace</button>
      <button id="print">Imprimir</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    var URL_TARGET = "https://c4rl05-git.github.io/informacion-nutrimental/";
    var PATH_D = "M4 4.5h7m1 0h1m2 0h2m3 0h2m1 0h6m1 0h7M4 5.5h1m5 0h1m1 0h2m4 0h1m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m2 0h1m1 0h5m2 0h2m2 0h1m3 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h2m1 0h2m5 0h2m2 0h1m3 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m4 0h1m1 0h1m2 0h2m1 0h2m3 0h1m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m2 0h1m1 0h1m1 0h1m1 0h2m1 0h2m6 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h2m1 0h2m2 0h3m4 0h3M4 12.5h1m1 0h2m1 0h3m1 0h2m3 0h5m2 0h2m1 0h1m1 0h1m2 0h1m1 0h2M4 13.5h3m1 0h1m3 0h6m3 0h4m2 0h2m1 0h2m1 0h4M10 14.5h3m2 0h3m2 0h1m1 0h1m4 0h1m1 0h1m1 0h3m1 0h2M4 15.5h3m4 0h2m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m3 0h1m1 0h2m1 0h1m2 0h1M4 16.5h5m1 0h3m5 0h1m1 0h1m5 0h2m1 0h1m1 0h3m1 0h2M4 17.5h1m2 0h3m1 0h1m1 0h3m1 0h2m4 0h1m1 0h1m2 0h1m2 0h1m1 0h1m1 0h1M5 18.5h2m3 0h1m1 0h1m2 0h1m7 0h2m3 0h1m1 0h3m1 0h1M7 19.5h1m3 0h6m2 0h1m2 0h1m2 0h2m2 0h6M5 20.5h3m2 0h5m1 0h3m3 0h1m1 0h4m1 0h2m1 0h3M8 21.5h2m1 0h2m1 0h1m1 0h1m2 0h1m2 0h1m1 0h7m1 0h2m1 0h2M4 22.5h1m3 0h3m1 0h2m2 0h1m1 0h3m1 0h1m2 0h2m1 0h5m1 0h2M5 23.5h2m1 0h1m2 0h1m1 0h2m1 0h1m1 0h1m2 0h3m2 0h1m5 0h1M5 24.5h2m1 0h1m1 0h3m1 0h1m1 0h2m1 0h2m4 0h1m2 0h2m3 0h2M4 25.5h1m1 0h3m2 0h1m2 0h3m2 0h2m2 0h3m1 0h1m2 0h1m2 0h1m2 0h1M8 26.5h1m1 0h3m3 0h2m1 0h1m1 0h2m1 0h4m2 0h3m2 0h2M5 27.5h2m4 0h1m1 0h7m2 0h3m2 0h2m1 0h1m1 0h2M4 28.5h1m2 0h1m1 0h2m3 0h1m2 0h1m3 0h1m4 0h7m2 0h1M12 29.5h2m2 0h5m2 0h2m3 0h1m3 0h2M4 30.5h7m1 0h1m3 0h2m2 0h4m3 0h2m1 0h1m1 0h1M4 31.5h1m5 0h1m1 0h1m1 0h2m1 0h2m1 0h3m1 0h5m3 0h3m1 0h1M4 32.5h1m1 0h3m1 0h1m3 0h1m3 0h5m2 0h8m1 0h2M4 33.5h1m1 0h3m1 0h1m1 0h1m1 0h5m1 0h1m3 0h3m2 0h1m1 0h1m4 0h1M4 34.5h1m1 0h3m1 0h1m1 0h1m1 0h2m3 0h4m2 0h1m1 0h5m1 0h2M4 35.5h1m5 0h1m2 0h1m1 0h1m2 0h1m2 0h1m1 0h1m2 0h4m1 0h2m3 0h1M4 36.5h7m1 0h4m1 0h2m1 0h2m2 0h2m1 0h1m4 0h1m1 0h1";
    var GRID = 41;

    function setStatus(msg, error) {
      var el = document.getElementById("status");
      el.textContent = msg || "";
      el.style.color = error ? "#a8324a" : "#3f7a4a";
    }

    /* Reconstruye la matriz a partir del path y la dibuja en el canvas. */
    function drawToCanvas(canvas, scale) {
      canvas.width = canvas.height = GRID * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000000";

      var re = /([Mm])([\d.]+)[ ,]+([\d.]+)|h([\d.]+)/g;
      var m, row = 0, col = 0;
      while ((m = re.exec(PATH_D)) !== null) {
        if (m[1]) {
          var a = parseFloat(m[2]), b = parseFloat(m[3]);
          if (m[1] === "M") { col = a; row = Math.floor(b); }
          else { col += a; row += Math.floor(b); }
        } else {
          var n = parseFloat(m[4]);
          ctx.fillRect(col * scale, row * scale, n * scale, scale);
          col += n;
        }
      }
    }

    document.getElementById("png").addEventListener("click", function () {
      try {
        var canvas = document.createElement("canvas");
        drawToCanvas(canvas, 20); // 820 x 820 px
        canvas.toBlob(function (blob) {
          if (!blob) { setStatus("No se pudo generar el PNG.", true); return; }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "qr-informacion-nutrimental.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
          setStatus("PNG descargado.");
        }, "image/png");
      } catch (e) {
        setStatus("No se pudo generar el PNG: " + e.message, true);
      }
    });

    document.getElementById("svg").addEventListener("click", function () {
      var a = document.createElement("a");
      a.href = "qr.svg";
      a.download = "qr-informacion-nutrimental.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setStatus("SVG descargado.");
    });

    document.getElementById("copy").addEventListener("click", function () {
      var done = function () { setStatus("Enlace copiado."); };
      var fail = function () { setStatus("Copia manual: " + URL_TARGET, true); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(URL_TARGET).then(done, fail);
      } else {
        fail();
      }
    });

    document.getElementById("print").addEventListener("click", function () {
      window.print();
    });
  </script>

</body>
</html>
